# St. Philomena's College (Autonomous) - Production Nginx Configuration
# Reverse proxy uniting React SPA and Laravel API under unified SSL domain

server {
    listen 80;
    listen [::]:80;
    server_name stphilos.ac.in www.stphilos.ac.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stphilos.ac.in www.stphilos.ac.in;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/stphilos.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stphilos.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root for React Frontend Production Build
    root /var/www/stphilos/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum Upload Size for Institutional Documents & Media
    client_max_body_size 128M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Institutional Media & Document Asset Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|mp4|webm|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. Laravel Backend API & Admin Routes
    location /api {
        root /var/www/stphilos/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/stphilos/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    # 4. Storage Uploads from Laravel
    location /storage/ {
        alias /var/www/stphilos/backend/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Deny access to sensitive hidden files
    location ~ /\. {
        deny all;
    }
}
