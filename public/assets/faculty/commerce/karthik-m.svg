      <stop offset="0%" stop-color="#047857" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#071A33" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="glow-karthik-m" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FFD84A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-karthik-m)" />
  <circle cx="200" cy="150" r="100" fill="url(#glow-karthik-m)" />
  
  <!-- Academic Silhouette -->
  <circle cx="200" cy="150" r="65" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFD84A" stroke-width="3" stroke-opacity="0.7" />
  <path d="M 90 360 C 90 270, 150 240, 200 240 C 250 240, 310 270, 310 360 Z" fill="#FFFFFF" fill-opacity="0.12" />
  
  <!-- Initials Monogram -->
  <text x="200" y="168" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KM</text>
  
  <!-- Tag Strip -->
  <rect x="20" y="335" width="360" height="45" rx="8" fill="#071A33" fill-opacity="0.9" stroke="#FFD84A" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="200" y="363" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#FFD84A" text-anchor="middle">Mr. Karthik M</text>
